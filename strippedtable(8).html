<html>

<title>strippedtable</title>
<style>
#table{
width:100%;
border-collapse:collapse;
font-family:sans-serif;
}

#table th{
padding:20px;
text-align:left;
color:white;
background-color:#b22222;
border:1px solid grey;
}

table td{
padding:8px;
border:1px solid grey;
}

table tr:hover{
background-color:burlywood;
}

table tr:nth-child(even){
background-color:#F2F2F2;
}
</style>
</head>
